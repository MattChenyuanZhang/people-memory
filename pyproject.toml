[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "people-match-memory"
version = "0.1.0"
description = "Local, evidence-backed relationship memory for AI assistants"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = []

[project.urls]
Repository = "https://github.com/MattChenyuanZhang/people-memory"
Issues = "https://github.com/MattChenyuanZhang/people-memory/issues"

[project.optional-dependencies]
mcp = ["mcp>=1.12,<2"]

[project.scripts]
people-match = "people_match.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
people_match = ["instructions.md", "bundled_skills/*/SKILL.md", "bundled_skills/*/agents/*.yaml"]
